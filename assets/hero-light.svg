<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8F9FA" />
      <stop offset="50%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#CBD5E0" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4B0082">
        <animate attributeName="stop-color" values="#4B0082;#0055FF;#6A0DAD;#4B0082" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#0055FF">
        <animate attributeName="stop-color" values="#0055FF;#4B0082;#0055FF;#0055FF" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <style>
      .name { font-family: 'Inter', system-ui, sans-serif; font-size: 34px; font-weight: 800; fill: url(#textGrad); letter-spacing: 1px; }
      .title { font-family: 'Inter', system-ui, sans-serif; font-size: 16px; font-weight: 600; fill: #4A5568; }
      .glass { fill: rgba(255, 255, 255, 0.6); stroke: rgba(0, 0, 0, 0.05); stroke-width: 1; backdrop-filter: blur(10px); rx: 16; }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      .fade-in-1 { opacity: 0; animation: fadeIn 1s ease-out forwards 0.5s; }
      .fade-in-2 { opacity: 0; animation: fadeIn 1s ease-out forwards 0.8s; }
      .fade-in-3 { opacity: 0; animation: fadeIn 1s ease-out forwards 1.1s; }
      .fade-in-4 { opacity: 0; animation: fadeIn 1s ease-out forwards 1.4s; }
      @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-8px); } 100% { transform: translateY(0px); } }
      .floating { animation: float 6s ease-in-out indefinite; }
      .dots { fill: #4B0082; opacity: 0.1; }
    </style>
    <pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle fill="#4B0082" cx="2" cy="2" r="1" opacity="0.1" />
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)" />
  <rect width="100%" height="100%" fill="url(#dots)" />
  
  <g class="floating">
    <rect x="40" y="60" width="720" height="280" class="glass" />
    <circle cx="80" cy="100" r="6" fill="#FF5F56" />
    <circle cx="105" cy="100" r="6" fill="#FFBD2E" />
    <circle cx="130" cy="100" r="6" fill="#27C93F" />
    
    <text x="80" y="170" class="name fade-in-1">Hi, I'm BAARGAVAN ANANDHAKUMAR</text>
    
    <text x="80" y="220" class="title fade-in-2">>&nbsp; Java Developer | Full Stack Developer | Cloud Enthusiast</text>
    <text x="80" y="255" class="title fade-in-3">>&nbsp; Student Developer | Problem Solver</text>
    <text x="80" y="290" class="title fade-in-4">>&nbsp; B.Tech IT '27 @ Dr. N.G.P Institute of Technology</text>
  </g>
</svg>