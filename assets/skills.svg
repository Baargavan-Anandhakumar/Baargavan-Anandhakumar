<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="800" height="250">
  <style>
    .text { font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 600; fill: #E2E8F0; text-anchor: middle; }
    .box { fill: rgba(255, 255, 255, 0.05); stroke: rgba(125, 249, 255, 0.2); stroke-width: 1; rx: 8; transition: all 0.3s; }
    @keyframes pop { 0% { transform: scale(0.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    .item { animation: pop 0.5s ease-out forwards; opacity: 0; }
  </style>
  <rect width="100%" height="100%" fill="transparent" />
  
  <g transform="translate(50, 40)" class="item" style="animation-delay: 0.1s">
    <rect width="120" height="40" class="box" />
    <text x="60" y="25" class="text">Java</text>
  </g>
  <g transform="translate(190, 40)" class="item" style="animation-delay: 0.2s">
    <rect width="120" height="40" class="box" />
    <text x="60" y="25" class="text">HTML/CSS</text>
  </g>
  <g transform="translate(330, 40)" class="item" style="animation-delay: 0.3s">
    <rect width="120" height="40" class="box" />
    <text x="60" y="25" class="text">SQL</text>
  </g>
  <g transform="translate(470, 40)" class="item" style="animation-delay: 0.4s">
    <rect width="120" height="40" class="box" />
    <text x="60" y="25" class="text">Embedded C</text>
  </g>
  <g transform="translate(610, 40)" class="item" style="animation-delay: 0.5s">
    <rect width="120" height="40" class="box" />
    <text x="60" y="25" class="text">AWS</text>
  </g>

  <g transform="translate(120, 100)" class="item" style="animation-delay: 0.6s">
    <rect width="120" height="40" class="box" />
    <text x="60" y="25" class="text">Linux</text>
  </g>
  <g transform="translate(260, 100)" class="item" style="animation-delay: 0.7s">
    <rect width="120" height="40" class="box" />
    <text x="60" y="25" class="text">IoT</text>
  </g>
  <g transform="translate(400, 100)" class="item" style="animation-delay: 0.8s">
    <rect width="120" height="40" class="box" />
    <text x="60" y="25" class="text">Cloud Deploy</text>
  </g>
  <g transform="translate(540, 100)" class="item" style="animation-delay: 0.9s">
    <rect width="120" height="40" class="box" />
    <text x="60" y="25" class="text">Arduino IDE</text>
  </g>
</svg>