<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <style>
    .text-title { font-family: 'Inter', sans-serif; font-size: 20px; font-weight: bold; fill: #7DF9FF; }
    .text-subtitle { font-family: 'Inter', sans-serif; font-size: 14px; fill: #A0AEC0; }
    .line { stroke: #6A0DAD; stroke-width: 4; stroke-linecap: round; }
    .dot { fill: #00FFFF; stroke: #121212; stroke-width: 4; }
    @keyframes draw { from { stroke-dashoffset: 1000; } to { stroke-dashoffset: 0; } }
    .animated-line { stroke-dasharray: 1000; animation: draw 2s ease-out forwards; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .fade { opacity: 0; animation: fadeIn 1s ease-out forwards; }
  </style>
  <rect width="100%" height="100%" fill="transparent" />
  
  <line x1="150" y1="50" x2="150" y2="400" class="line animated-line" />
  
  <g transform="translate(0, 80)" class="fade" style="animation-delay: 0.5s">
    <circle cx="150" cy="0" r="8" class="dot" />
    <text x="180" y="-5" class="text-title">B.Tech Information Technology</text>
    <text x="180" y="20" class="text-subtitle">Dr. N.G.P Institute of Technology • 2027 (Expected) • CGPA 7.2</text>
  </g>

  <g transform="translate(0, 170)" class="fade" style="animation-delay: 1.0s">
    <circle cx="150" cy="0" r="8" class="dot" />
    <text x="180" y="-5" class="text-title">AWS Cloud Computing Intern</text>
    <text x="180" y="20" class="text-subtitle">Amazon EC2, S3, IAM, VPC, Linux, Deployment</text>
  </g>

  <g transform="translate(0, 260)" class="fade" style="animation-delay: 1.5s">
    <circle cx="150" cy="0" r="8" class="dot" />
    <text x="180" y="-5" class="text-title">Diploma Computer Engineering</text>
    <text x="180" y="20" class="text-subtitle">CIT Sandwich Polytechnic College • CGPA 7.8</text>
  </g>
  
  <g transform="translate(0, 350)" class="fade" style="animation-delay: 2.0s">
    <circle cx="150" cy="0" r="8" class="dot" />
    <text x="180" y="-5" class="text-title">Certifications &amp; Memberships</text>
    <text x="180" y="20" class="text-subtitle">AWS Cloud Computing, NPTEL HCI &amp; Industry 4.0, IEEE Student Member</text>
  </g>
</svg>