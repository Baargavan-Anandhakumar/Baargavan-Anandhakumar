<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="cyber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a" />
      <stop offset="40%" stop-color="#1a0b2e" />
      <stop offset="100%" stop-color="#001a33" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#7DF9FF" stroke-width="0.5" stroke-opacity="0.1"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#cyber)" />
  <rect width="100%" height="100%" fill="url(#grid)" />
  <circle cx="20%" cy="30%" r="300" fill="#6A0DAD" opacity="0.1" filter="blur(80px)" />
  <circle cx="80%" cy="70%" r="400" fill="#00FFFF" opacity="0.08" filter="blur(100px)" />
