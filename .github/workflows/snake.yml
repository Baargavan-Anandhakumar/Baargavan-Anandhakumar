name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate contribution grid snake
        uses: Platane/snk@v3
        with:
          github_user_name: Baargavan-Anandhakumar
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Move SVGs to assets folder
        run: |
          mkdir -p assets
          mv dist/github-contribution-grid-snake.svg assets/
          mv dist/github-contribution-grid-snake-dark.svg assets/

      - name: Commit and push the generated SVGs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated: Update Contribution Snake"
          file_pattern: assets/*.svg
          branch: main
