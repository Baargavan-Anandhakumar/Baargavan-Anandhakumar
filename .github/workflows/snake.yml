name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate contribution grid snake
        uses: Platane/snk@v3
        with:
          github_user_name: Baargavan-Anandhakumar
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Copy SVGs to assets folder
        run: |
          mkdir -p assets
          rm -f assets/github-contribution-grid-snake.svg
          rm -f assets/github-contribution-grid-snake-dark.svg
          chmod -R u+rwX assets
          if [ -f "dist/github-contribution-grid-snake.svg" ]; then
            sed -i 's/<\/svg>/<style>.u { display: none !important; }<\/style><\/svg>/g' dist/github-contribution-grid-snake.svg
            cp dist/github-contribution-grid-snake.svg assets/github-contribution-grid-snake.svg
          fi
          if [ -f "dist/github-contribution-grid-snake-dark.svg" ]; then
            sed -i 's/<\/svg>/<style>.u { display: none !important; }<\/style><\/svg>/g' dist/github-contribution-grid-snake-dark.svg
            cp dist/github-contribution-grid-snake-dark.svg assets/github-contribution-grid-snake-dark.svg
          fi

      - name: Commit and push the generated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-contribution-grid-snake.svg assets/github-contribution-grid-snake-dark.svg
          git diff --cached --quiet || git commit -m "chore: update contribution snake"
          git push
